name: Validate DonAssos AI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB_NAME: donassos_ai_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AI ranking test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "scipy>=1.11" "scikit-learn>=1.3" "pydantic>=2" "fastapi>=0.110" "motor>=3.3" "pymongo>=4.6" "pytest>=8" "pytest-asyncio>=0.23"
      - name: Execute ranking unit tests and MongoDB integration test
        run: python -m pytest tests -q
